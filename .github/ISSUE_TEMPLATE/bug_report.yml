name: Bug report
description: Report a problem with trividia-truemetrix-ble
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Package version
      description: Output of `pip show trividia-truemetrix-ble` or the commit/tag in use
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS, Python version, and BLE backend (e.g. Linux + BlueZ version, macOS, Windows)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you run, and what happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: Run with `--verbose` (CLI) or `logging.basicConfig(level=logging.DEBUG)` and paste relevant output.
      render: shell
